<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 輪播與卡片範例</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* 確保 Carousel 圖片固定大小並維持比例 */
        .carousel-item img {
            width: 1280px;
            height: 500px;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <!-- 1. Carousel 輪播圖 (四張圖片) -->
    <div id="mainCarousel" class="carousel slide" data-bs-ride="carousel">
        <!-- 輪播指示器 -->
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            <button type="button" data-bs-target="#mainCarousel" data-bs-slide-to="3" aria-label="Slide 4"></button>
        </div>

        <!-- 輪播內容 -->
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1280/500?random=1" class="d-block w-100" alt="輪播圖 1">
                <div class="carousel-caption d-none d-md-block">
                    <h5>第一張輪播圖</h5>
                    <p>圖片尺寸 1280x500 像素。</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1280/500?random=2" class="d-block w-100" alt="輪播圖 2">
                <div class="carousel-caption d-none d-md-block">
                    <h5>第二張輪播圖</h5>
                    <p>圖片尺寸 1280x500 像素。</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1280/500?random=3" class="d-block w-100" alt="輪播圖 3">
                <div class="carousel-caption d-none d-md-block">
                    <h5>第三張輪播圖</h5>
                    <p>圖片尺寸 1280x500 像素。</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1280/500?random=4" class="d-block w-100" alt="輪播圖 4">
                <div class="carousel-caption d-none d-md-block">
                    <h5>第四張輪播圖</h5>
                    <p>圖片尺寸 1280x500 像素。</p>
                </div>
            </div>
        </div>

        <!-- 切換按鈕 -->
        <button class="carousel-control-prev" type="button" data-bs-target="#mainCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">上一張</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#mainCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">下一張</span>
        </button>
    </div>

    <!-- 2. Cards (同一水平列的 4 張圖文卡片) -->

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">

                <div class="card h-100">
                    <img src="https://picsum.photos/400/300?random=5" class="card-img-top" alt="卡片圖 1">
                    <div class="card-body">
                        <h5 class="card-title">卡片標題一</h5>
                        <p class="card-text">這是第一張圖文卡片的描述文字內容。</p>
                    </div>
                </div>
            </div>
            <!-- 卡片 2 -->
            <div class="col">

                    <img src="https://picsum.photos/400/300?random=6" class="card-img-top" alt="卡片圖 2">

                        <h5 class="card-title">卡片標題二</h5>
                        <p class="card-text">這是第二張圖文卡片的描述文字內容。</p>
                    </div>
                </div>
            </div>
